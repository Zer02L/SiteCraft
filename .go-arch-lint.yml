version: 3

workdir: .

allow:
  depOnAnyVendor: true

exclude:
  - internal/testutil/**
  - tmp/**
  - bin/**
  - .worktrees/**

excludeFiles:
  - "^.*_test\\.go$"

components:
  app:
    in: .
  cmd:
    in: cmd/**
  sql:
    in: sql/**
  ui:
    in: ui/**
  typography:
    in: internal/typography/**
  models:
    in: internal/models/**
  data:
    in: internal/data/**
  db:
    in: internal/db/**
  cache:
    in: internal/cache/**
  auth:
    in: internal/auth/**
  events:
    in: internal/events/**
  media:
    in: internal/media/**
  notifications:
    in: internal/notifications/**
  modules:
    in: internal/modules/**
  exporter:
    in: internal/exporter/**
  i18n:
    in: internal/i18n/**
  theme:
    in: internal/theme/**
  checker:
    in: internal/checker/**
  importer:
    in: internal/importer/**
  ai:
    in: internal/ai/**
  server:
    in: internal/server/**

commonComponents:
  - models
  - typography
  - theme

deps:
  theme:
    anyVendorDeps: true
  typography:
    anyVendorDeps: true
  app:
    anyVendorDeps: true
    mayDependOn:
      - server
      - db
      - data
      - cache
      - exporter
      - notifications
      - auth
      - media

  cmd:
    anyVendorDeps: true
    mayDependOn:
      - db
      - data

  sql:
    anyVendorDeps: true

  ui:
    anyVendorDeps: true
    anyProjectDeps: true

  models:
    anyVendorDeps: true

  db:
    anyVendorDeps: true
    mayDependOn:
      - sql

  cache:
    anyVendorDeps: true

  data:
    anyVendorDeps: true
    mayDependOn:
      - db
      - cache

  auth:
    anyVendorDeps: true
    mayDependOn:
      - db
      - data

  events:
    anyVendorDeps: true

  media:
    anyVendorDeps: true
    mayDependOn:
      - db

  notifications:
    anyVendorDeps: true
    mayDependOn:
      - db
      - data
      - events

  modules:
    anyVendorDeps: true
    mayDependOn:
      - db
      - notifications

  exporter:
    anyVendorDeps: true
    mayDependOn:
      - data
      - ui

  i18n:
    anyVendorDeps: true

  checker:
    anyVendorDeps: true
    mayDependOn:
      - db
      - data
      - events

  importer:
    anyVendorDeps: true
    mayDependOn:
      - db
      - data
      - media

  ai:
    anyVendorDeps: true
    mayDependOn:
      - db
      - data

  server:
    anyVendorDeps: true
    mayDependOn:
      - ai
      - auth
      - cache
      - checker
      - data
      - db
      - events
      - exporter
      - i18n
      - importer
      - media
      - modules
      - notifications
      - ui
