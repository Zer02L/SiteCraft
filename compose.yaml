services:
  sitecraft:
    build:
      context: .
      containerfile: Containerfile
    image: sitecraft:latest
    container_name: sitecraft
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - sitecraft_data:/data:Z
    environment:
      - TZ=Europe/Moscow

volumes:
  sitecraft_data:
